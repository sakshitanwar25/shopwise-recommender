[project]
name = "shopwise-recommender"
version = "0.1.0"
description = "Production-oriented personalized recommendation engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "polars>=1.44.1",
    "psycopg[binary]>=3.3.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
